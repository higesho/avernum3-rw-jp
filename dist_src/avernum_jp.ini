; Avernum 3: Ruined World 日本語表示設定
[font]
; 日本語フォント名 (例: Meiryo, Yu Gothic UI, MS Gothic, Yu Mincho)
face=Meiryo
; 太さ 400=標準 700=太字
weight=700
; 文字の濃さ補正 (1.0=補正なし、小さいほど濃い)
alpha_gamma=0.7
; 文字サイズの増減 (px)
size_adjust=0
; 上下位置の調整 (px、+で下へ)
y_adjust=0
; 日本語文字間の追加スペース (px)
spacing=0
; 行と行のすき間の最小値 (px)。日本語の字の大きさは「行の高さ − この値」までに抑えられる
line_gap=1

[text]
; ゲームのテキストファイルの文字コード: eucjp (推奨、1文字2バイト) / utf8 (1文字3バイト)
encoding=eucjp
